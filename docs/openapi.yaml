openapi: 3.0.3
info:
  title: ForUsBots API
  version: 2.6.0
  description: |
    API for nine Playwright automation bots. Protected operations accept
    `x-auth-token` (or `Authorization: Bearer <token>`). Tokens are loaded from
    `tokens.json` (or the configured `TOKENS_FILE`); deployments may materialize
    that file from the `TOKENS_JSON` secret before startup.
servers:
  - url: http://localhost:10000
paths:
  /forusbot/health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK and supported integration contract versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /forusbot/status:
    get:
      summary: Global status snapshot
      description: |
        Si flags.statusPublic = false, requiere header x-auth-token.
        Endpoint público: no pasa por requireScope.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: false
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }

  /forusbot/jobs:
    get:
      summary: List jobs (queued/running/finished) — public shape
      description: |
        Devuelve el shape **público** minimalista por bot. Para detalle verbose con
        stages, métricas, meta interna y createdBy, ver `/forusbot/admin/jobs-db/:id`
        (requiere admin token).
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
        - in: query
          name: state
          schema: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        - in: query
          name: botId
          description: Runtime bot identifier used by queue filtering.
          schema:
            type: string
            enum:
              - vault-file-upload
              - scrape-participant
              - scrape-plan
              - search-participants
              - forusall-mfa-reset
              - update-participant
              - update-plan
              - forusall-emailtrigger
              - users-management
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, total, limit, offset, jobs]
                properties:
                  ok: { type: boolean }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/JobPublicResponse'
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }

  /forusbot/jobs/{id}:
    get:
      summary: Get job by id — public shape
      description: |
        Devuelve el shape **público** minimalista por bot. Para detalle verbose con
        stages, métricas, meta interna y createdBy, ver `/forusbot/admin/jobs-db/:id`
        (requiere admin token).
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobPublicResponse'
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not Found }
        '503':
          description: Durable job state is temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string, example: "Job state temporarily unavailable" }
    delete:
      summary: Cancel queued job
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Cancelled / Not Cancelled }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not Found }
        '409': { description: Conflict (running) }

  /forusbot/locks:
    get:
      summary: View login/TOTP locks
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }

  /forusbot/settings:
    get:
      summary: Get runtime settings
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: Patch runtime settings
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxConcurrency: { type: integer, minimum: 1 }
                flags:
                  type: object
                  properties:
                    statusPublic: { type: boolean }
      responses:
        '200': { description: OK }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }

  /forusbot/metrics:
    get:
      summary: Runtime metrics
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }

  /forusbot/version:
    get:
      summary: Package version
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
  
  /forusbot/search-participants:
    post:
      summary: Search participants
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                criteria:
                  type: object
                  properties:
                    companyName: { type: string, nullable: true }
                    fullName:    { type: string, nullable: true }
                    email:       { type: string, nullable: true }
                    ssn:         { type: string, nullable: true, description: "last 4" }
                    phone:       { type: string, nullable: true }
                    participantId: { type: string, nullable: true }
                options:
                  type: object
                  properties:
                    fetchAllPages:    { type: boolean }
                    pageLimit:        { type: integer, minimum: 1 }
                    maxRows:          { type: integer, minimum: 1 }
                    evidenceOnSuccess:{ type: boolean }
                    timeoutMs:        { type: integer, minimum: 1000 }
      responses:
        '202': { description: Accepted (returns jobId) }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Internal Server Error }

  /health:
    get:
      summary: Health check (plain)
      responses:
        '200':
          description: OK and supported integration contract versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /forusbot/whoami:
    get:
      summary: Identity of current token
      description: |
        Returns the role, user metadata, ForUsAll account alias and the
        effective scope of the authenticated token. Consumed by the sandbox UI
        to decide which endpoints to enable.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhoAmI'
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }

  /forusbot/sandbox/vault-file-upload:
    post:
      summary: Dry-run validator for upload headers/body
      description: |
        Validates x-filename and x-meta without creating a job. Accepts .pdf files only.
      requestBody:
        required: false
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
      parameters:
        - in: header
          name: x-filename
          schema: { type: string }
          required: true
          description: Must end with .pdf
        - in: header
          name: x-meta
          schema: { type: string }
          required: true
      responses:
        '200': { description: OK }
        '400': { description: Bad Request }
        '422': { description: Unprocessable Entity }

  /forusbot/scrape-participant:
    post:
      summary: Enqueue participant scraping job
      description: |
        Modules: census, savings_rate, plan_details, loans, payroll, communications, documents, mfa.
        Payroll static fields: Payroll Frequency, Next Schedule paycheck, Available Years, Latest Payroll.
        Latest Payroll returns the first detail row (most recent pay date) from the most recent payroll year.
        Dynamic payroll fields: "Payroll YYYY" for year tables; tokens "years:all" or "years:2024,2025".
        When Idempotency-Key is supplied, the receipt is durable for at least 90 days:
        the same key and normalized request returns the same jobId, while a different
        request under the same principal and endpoint returns 409 without enqueueing.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[!-~]{8,200}$'
          required: false
          description: Opaque printable-ASCII retry key. Required for durable retry safety.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participantId: { type: string }
                return: { type: string, enum: [data, html, text, both] }
                strict: { type: boolean }
                includeScreens: { type: boolean }
                timeoutMs: { type: integer, minimum: 5000 }
                modules:
                  type: array
                  items:
                    oneOf:
                      - { type: string }
                      - type: object
                        properties:
                          key: { type: string }
                          fields:
                            type: array
                            items: { type: string }
      responses:
        '202':
          description: Accepted, or replay of the original accepted job
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ['true', 'false'] }
              description: True when this response reuses an existing durable receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitJobResponse'
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Validation failed }
        '409': { description: Idempotency-Key reused with a different request }
        '503': { description: Durable idempotency or job state temporarily unavailable }
        '500': { description: Internal Server Error }

  /forusbot/scrape-plan:
    post:
      summary: Enqueue plan scraping job
      description: |
        Extracts structured plan data from the ForUsAll employer portal. Supports extracting from 6 modules:
        basic_info (16 fields), plan_design (26 fields), onboarding (6 fields), communications (6 fields),
        extra_settings (10 fields), feature_flags (3 fields). Also extracts plan notes history.
        When Idempotency-Key is supplied, the receipt is durable for at least 90 days:
        the same key and normalized request returns the same jobId, while a different
        request under the same principal and endpoint returns 409 without enqueueing.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[!-~]{8,200}$'
          required: false
          description: Opaque printable-ASCII retry key. Required for durable retry safety.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId]
              properties:
                planId:
                  type: string
                  description: Plan ID to scrape (e.g., "627")
                  example: "627"
                modules:
                  type: array
                  description: |
                    Modules to extract. Can be strings (extract all fields) or objects with field selection.
                    Available modules: basic_info, plan_design, onboarding, communications, extra_settings, feature_flags.
                    If empty or omitted, defaults to ["basic_info"].
                  items:
                    oneOf:
                      - type: string
                        description: Module key (extracts all fields from module)
                        example: "basic_info"
                      - type: object
                        description: Module with specific field selection
                        required: [key]
                        properties:
                          key:
                            type: string
                            description: Module key
                            example: "plan_design"
                          fields:
                            type: array
                            description: Specific fields to extract from this module
                            items:
                              type: string
                            example: ["record_keeper_id", "rk_plan_id"]
                  example: ["basic_info", {"key": "plan_design", "fields": ["record_keeper_id"]}]
                return:
                  type: string
                  enum: [data, html, text, both]
                  default: data
                  description: |
                    Return mode: 
                    - data: structured data only
                    - html: raw HTML only
                    - text: plain text only
                    - both: data + html + text
                strict:
                  type: boolean
                  default: false
                  description: If true, fail entire job if any module or field validation fails
                includeScreens:
                  type: boolean
                  default: false
                  description: Include screenshots in result (evidence)
                timeoutMs:
                  type: integer
                  minimum: 5000
                  default: 30000
                  description: Job timeout in milliseconds
            examples:
              allModules:
                summary: Extract all modules
                value:
                  planId: "627"
                  modules: ["basic_info", "plan_design", "onboarding", "communications", "extra_settings", "feature_flags"]
              specificModule:
                summary: Extract only basic info
                value:
                  planId: "627"
                  modules: ["basic_info"]
              specificFields:
                summary: Extract specific fields from modules
                value:
                  planId: "627"
                  modules:
                    - key: "basic_info"
                      fields: ["plan_id", "company_name", "ein", "status"]
                    - key: "plan_design"
                      fields: ["record_keeper_id", "enrollment_type"]
              withScreenshots:
                summary: Extract with evidence screenshots
                value:
                  planId: "627"
                  modules: ["basic_info", "plan_design"]
                  includeScreens: true
              strictMode:
                summary: Strict mode (fail on any error)
                value:
                  planId: "627"
                  modules: ["basic_info", "plan_design"]
                  strict: true
      responses:
        '202':
          description: Accepted, or replay of the original accepted job
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ['true', 'false'] }
              description: True when this response reuses an existing durable receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitJobResponse'
        '400':
          description: Invalid request format
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string, example: "planId es obligatorio" }
        '401':
          description: Missing or invalid authentication token
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string, example: "unauthorized" }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string, example: "modules contiene claves no soportadas" }
                  invalid: { type: array, items: { type: string } }
                  allowed: { type: array, items: { type: string } }
                  fieldErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        reason: { type: string }
                        details: { type: object }
        '409':
          description: Idempotency-Key reused with a different request
        '503':
          description: Durable idempotency or job state temporarily unavailable
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string, example: "Internal Error" }

  /forusbot/mfa-reset:
    post:
      summary: Enqueue MFA reset for participant
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                participantId: { type: string }
              required: [participantId]
      responses:
        '202': { description: Accepted (returns jobId) }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Internal Server Error }

  /forusbot/openapi:
    get:
      summary: Serve this OpenAPI (YAML)
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      responses:
        '200':
          description: OK
          content:
            text/yaml: {}
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }

  /forusbot/vault-file-upload:
    post:
      summary: Accept a new upload job (202 Accepted)
      description: |
        Uploads a document to the ForUsAll portal. Supports PDF, Excel (.xlsx, .xls), CSV, and ZIP files.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
        - in: header
          name: x-filename
          schema: { type: string }
          required: true
          description: Must end with .pdf, .xlsx, .xls, .csv, or .zip
        - in: header
          name: x-meta
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
          application/pdf:
            schema: { type: string, format: binary }
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema: { type: string, format: binary }
          application/vnd.ms-excel:
            schema: { type: string, format: binary }
          text/csv:
            schema: { type: string, format: binary }
          application/zip:
            schema: { type: string, format: binary }
      responses:
        '202': { description: Accepted (returns jobId and estimate) }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Unprocessable Entity }
        '500': { description: Internal Server Error }
    
  /forusbot/update-plan:
    post:
      summary: Update plan edit form with note (RESTRICTED to ivan.alvis@forusall.com)
      description: |
        Abre `https://employer.forusall.com/plans/{planId}/edit` y aplica los
        cambios indicados en `updates`, llena la nota obligatoria y hace click
        en `Save`. La señal de **éxito** es la navegación/refresh automático
        de la página; la señal de **fallo** es un `alert()` JS del navegador
        cuyo texto se devuelve en `error`/`message`.

        Las claves de `updates` son el atributo HTML `name` exacto del
        formulario (p. ej. `company_name`, `ein`, `effective_date`,
        `accept_covid19_amendment`, `default_savings_rate`). Cada campo se
        clasifica automáticamente del DOM (text / number / select / checkbox /
        date / textarea). Para `employer_contribution_formula` se hace
        **reemplazo total**: se eliminan los tiers existentes y se agregan los
        nuevos.

        **Restricción de acceso:** este endpoint sólo acepta el token de
        `ivan.alvis@forusall.com`. Cualquier otro usuario (incluso admins)
        recibe `403 forbidden`.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
          description: Token de ivan.alvis@forusall.com (los demás reciben 403)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, note, updates]
              properties:
                planId:
                  type: string
                  description: Portal plan ID (e.g. "580")
                note:
                  type: string
                  description: Nota obligatoria con el motivo del cambio
                updates:
                  type: object
                  description: |
                    Mapa name→value. Las claves son atributos HTML `name` del
                    formulario. Cualquier clave que termine en `_date` debe
                    cumplir `^\d{4}-\d{2}-\d{2}$`.
                  additionalProperties: true
                  example:
                    company_name: "Acme Corp"
                    ein: "98-7654321"
                    effective_date: "2025-05-01"
                    accept_covid19_amendment: false
                    default_savings_rate: 6
                    employer_contribution_formula:
                      - { match_value: 100, percent_pay: 3 }
                      - { match_value: 50, percent_pay: 5 }
                includeScreens:
                  type: boolean
                  default: false
                  description: Si es `true`, guarda screenshot en éxito y fallo
                timeoutMs:
                  type: integer
                  minimum: 5000
                  maximum: 120000
                  default: 30000
      responses:
        '202': { description: Accepted (returns jobId) }
        '400': { description: Bad Request (validation) }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Unprocessable Entity (validation) }
        '500': { description: Internal Server Error }

  /forusbot/sandbox/update-plan:
    post:
      summary: Dry-run validator for update-plan (RESTRICTED to ivan.alvis@forusall.com)
      description: |
        Valida el payload de `update-plan` sin levantar Playwright ni tocar el
        portal. Devuelve los campos normalizados, el `targetUrl` que sería
        visitado y cualquier error de validación. Útil para verificar la
        forma del request antes de ejecutar el real.

        Aplica la **misma restricción de acceso** que el endpoint real: sólo
        el token de `ivan.alvis@forusall.com`.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, note, updates]
              properties:
                planId: { type: string }
                note: { type: string }
                updates:
                  type: object
                  additionalProperties: true
                includeScreens: { type: boolean }
                timeoutMs: { type: integer }
      responses:
        '200':
          description: OK (dry-run válido)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  mode: { type: string, example: "dry-run" }
                  wouldEnqueue:
                    type: object
                    properties:
                      botId: { type: string, example: "update-plan" }
                      endpoint: { type: string, example: "/forusbot/update-plan" }
                      targetUrl: { type: string }
                  normalized:
                    type: object
                    properties:
                      planId: { type: string }
                      note: { type: string }
                      updateKeys: { type: array, items: { type: string } }
                      tiersCount: { type: integer }
                      updates: { type: object, additionalProperties: true }
        '400': { description: Bad Request (validation) }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Internal Server Error }

  /forusbot/users-management/create:
    post:
      summary: Create portal user (RESTRICTED to ivan.alvis@forusall.com and sponsorservicesbot@forusall.com)
      description: |
        Navega a `https://employer.forusall.com/users/new`, completa el form
        `#new_user` con los datos del usuario y hace click en **Create**. La
        señal de **éxito** es la redirección a `/users` con el div
        `#flash_notice` mostrando `"User created successfully."`. La señal de
        **fallo** es la redirección a `/users` con `#error_explanation` listando
        los errores (ej. `Email can't be blank`).

        Los campos se llenan **siempre de arriba a abajo** siguiendo el orden
        del DOM:
        firstName → lastName → email → password/passwordConfirmation → role →
        sponsorIds → userGroupIds → payrollSetupIds → active →
        isNewDashboardUser → participantId → notAnEmployee → commSettings.

        Para los multi-selects (`sponsorIds`, `userGroupIds`,
        `payrollSetupIds`) se hace **reemplazo total**: el bot deselecciona
        todas las opciones y selecciona el conjunto enviado por ID.

        **Restricción de acceso:** este endpoint sólo acepta tokens de
        `ivan.alvis@forusall.com` y `sponsorservicesbot@forusall.com`.
        Cualquier otro usuario (incluso admins) recibe `403 forbidden`.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
          description: Token allowlistado (los demás reciben 403)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, note]
              properties:
                user:
                  type: object
                  required: [email, password, passwordConfirmation]
                  properties:
                    firstName: { type: string }
                    lastName:  { type: string }
                    email:     { type: string, format: email }
                    password:  { type: string }
                    passwordConfirmation: { type: string, description: Debe coincidir con password }
                    role:
                      type: integer
                      enum: [1, 2, 3, 4, 5, 6]
                      description: |
                        1=forus_admin, 2=sponsor_admin, 3=sponsor_rep,
                        4=super_admin, 5=cs_admin, 6=auditor
                    sponsorIds:
                      type: array
                      items: { type: integer, minimum: 1 }
                      description: IDs (no nombres) del select Sponsor brand
                    userGroupIds:
                      type: array
                      items: { type: integer, minimum: 1 }
                    payrollSetupIds:
                      type: array
                      items: { type: integer, minimum: 1 }
                    active:             { type: boolean, default: true }
                    isNewDashboardUser: { type: boolean, default: true }
                    participantId:      { type: string, nullable: true }
                    notAnEmployee:
                      type: boolean
                      description: Checkbox "Not an employee" (true = NO es empleado)
                    commSettings:
                      type: object
                      properties:
                        payrollTransaction:          { type: boolean }
                        monthlyEligibleParticipants: { type: boolean }
                        sponsorQuarterlyEmail:       { type: boolean }
                        simpleUploadReminder:        { type: boolean }
                        payrollUpdatesEmail:         { type: boolean }
                        loanUpdatesEmail:            { type: boolean }
                note:
                  type: string
                  description: Nota obligatoria con el motivo del alta (auditoría)
                includeScreens: { type: boolean, default: false }
                timeoutMs:
                  type: integer
                  minimum: 5000
                  maximum: 180000
                  default: 30000
            example:
              user:
                firstName: "Jane"
                lastName: "Doe"
                email: "jane.doe@example.com"
                password: "S3cretPass!"
                passwordConfirmation: "S3cretPass!"
                role: 2
                sponsorIds: [515, 221]
                active: true
                notAnEmployee: true
              note: "New sponsor admin for acorns"
      responses:
        '202': { description: Accepted (returns jobId) }
        '400': { description: Bad Request (missing fields) }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Unprocessable Entity (validation) }
        '500': { description: Internal Server Error }

  /forusbot/users-management/edit:
    post:
      summary: Edit portal user with optional MFA reset (RESTRICTED)
      description: |
        Navega a `https://employer.forusall.com/users/{userId}/edit`, aplica
        sólo los campos presentes en `updates` (semántica de patch), ejecuta
        opcionalmente Reset MFA, y hace click en **Update**. La señal de
        **éxito** es la redirección a `/users` con `#flash_notice` mostrando
        `"User updated successfully."`.

        El flag `resetMfa` controla qué botón(es) Reset MFA se ejecutan
        **antes** del submit final. Cada Reset MFA dispara su `confirm()` JS
        (lo aceptamos) y su `alert()` JS de éxito (lo aceptamos), y se valida
        que `#mfa_status` quede en `"not enrolled"`. El Reset MFA usa AJAX y
        NO submitea el form — los demás updates siguen aplicándose después
        con el click final de Update.

        **Restricción de acceso:** mismas allowlist que el endpoint de create.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, note]
              properties:
                userId:
                  type: integer
                  minimum: 1
                  description: Portal user ID (ej. 1062)
                updates:
                  type: object
                  description: |
                    Campos a modificar (sólo los presentes se aplican). Acepta
                    las mismas claves que `user` en /create excepto que
                    `email`/`password` son opcionales. Multi-selects son
                    reemplazo total.
                  properties:
                    firstName:            { type: string, nullable: true }
                    lastName:             { type: string, nullable: true }
                    email:                { type: string, format: email, nullable: true }
                    password:             { type: string, nullable: true }
                    passwordConfirmation: { type: string, nullable: true, description: Si uno presente, el otro también }
                    role:                 { type: integer, enum: [1,2,3,4,5,6] }
                    sponsorIds:           { type: array, items: { type: integer, minimum: 1 } }
                    userGroupIds:         { type: array, items: { type: integer, minimum: 1 } }
                    payrollSetupIds:      { type: array, items: { type: integer, minimum: 1 } }
                    active:               { type: boolean }
                    isNewDashboardUser:   { type: boolean }
                    participantId:        { type: string, nullable: true }
                    notAnEmployee:        { type: boolean }
                    commSettings:
                      type: object
                      additionalProperties: { type: boolean }
                resetMfa:
                  type: string
                  enum: [employer, admin, both, none]
                  default: none
                  description: Si != "none", ejecuta los Reset MFA correspondientes antes del submit
                note:
                  type: string
                  description: Nota obligatoria con el motivo del cambio
                includeScreens: { type: boolean, default: false }
                timeoutMs:
                  type: integer
                  minimum: 5000
                  maximum: 180000
                  default: 30000
            example:
              userId: 1062
              updates:
                firstName: "Pension"
                role: 3
                active: true
              resetMfa: "employer"
              note: "Update role per request from sponsor"
      responses:
        '202': { description: Accepted (returns jobId) }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: Unprocessable Entity (validation) }
        '500': { description: Internal Server Error }

  /forusbot/sandbox/users-management/create:
    post:
      summary: Dry-run validator for users-management/create (RESTRICTED)
      description: |
        Valida el payload de `users-management/create` sin levantar Playwright
        ni tocar el portal. Aplica la misma restricción de acceso que el
        endpoint real.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user, note]
              properties:
                user:           { type: object, additionalProperties: true }
                note:           { type: string }
                includeScreens: { type: boolean }
                timeoutMs:      { type: integer }
      responses:
        '200':
          description: OK (dry-run válido)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:   { type: boolean, example: true }
                  mode: { type: string,  example: "dry-run" }
                  wouldEnqueue:
                    type: object
                    properties:
                      botId:    { type: string, example: "users-management" }
                      endpoint: { type: string, example: "/forusbot/users-management/create" }
                      targetUrl: { type: string }
                  normalized:
                    type: object
                    properties:
                      note:     { type: string }
                      userKeys: { type: array, items: { type: string } }
                      user:     { type: object, additionalProperties: true }
        '400': { description: Bad Request (validation) }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Internal Server Error }

  /forusbot/sandbox/users-management/edit:
    post:
      summary: Dry-run validator for users-management/edit (RESTRICTED)
      description: |
        Valida el payload de `users-management/edit` sin levantar Playwright
        ni tocar el portal. Misma restricción de acceso que el real.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, note]
              properties:
                userId:         { type: integer, minimum: 1 }
                updates:        { type: object, additionalProperties: true }
                resetMfa:       { type: string, enum: [employer, admin, both, none] }
                note:           { type: string }
                includeScreens: { type: boolean }
                timeoutMs:      { type: integer }
      responses:
        '200':
          description: OK (dry-run válido)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:   { type: boolean, example: true }
                  mode: { type: string,  example: "dry-run" }
                  wouldEnqueue:
                    type: object
                    properties:
                      botId:    { type: string, example: "users-management" }
                      endpoint: { type: string, example: "/forusbot/users-management/edit" }
                      targetUrl: { type: string }
                  normalized:
                    type: object
                    properties:
                      userId:     { type: integer }
                      note:       { type: string }
                      updateKeys: { type: array, items: { type: string } }
                      resetMfa:   { type: string }
                      updates:    { type: object, additionalProperties: true }
        '400': { description: Bad Request (validation) }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Internal Server Error }

  /forusbot/update-participant:
    post:
      summary: Update participant (Census tab) with note
      description: |
        Opens the participant profile and updates fields in *Census*. The keys
        inside `updates` must be the exact labels shown in the portal UI (for
        example, `"Hire Date"`), not camelCase internal names. Unknown labels
        are ignored and returned as warnings; at least one recognized label is
        required. The note is required. Success requires the exact portal
        confirmation `Participant updated successfully.`.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId, note, updates]
              properties:
                participantId:
                  type: string
                  description: Portal participant ID
                note:
                  type: string
                  description: Nota obligatoria con el motivo del cambio
                updates:
                  type: object
                  minProperties: 1
                  additionalProperties: false
                  description: Exact Census UI label → value. At least one recognized label is required.
                  properties:
                    "First Name": { type: string, nullable: true }
                    "Last Name": { type: string, nullable: true }
                    "Preferred First Name": { type: string, nullable: true }
                    "Preferred Last Name": { type: string, nullable: true }
                    "Eligibility Status":
                      type: string
                      enum: [A, D, I, X, U]
                    "Birth Date": { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', nullable: true }
                    "Hire Date": { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', nullable: true }
                    "Rehire Date": { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', nullable: true }
                    "Termination Date": { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', nullable: true }
                    "Projected Plan Entry Date": { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', nullable: true }
                    "Address 1": { type: string, nullable: true }
                    "Address 2": { type: string, nullable: true }
                    "City": { type: string, nullable: true }
                    "State": { type: string, minLength: 2, maxLength: 2, nullable: true }
                    "Zip Code": { type: string, nullable: true }
                    "Zipcode": { type: string, nullable: true, description: Accepted compatibility alias for "Zip Code". }
                    "Primary Email": { type: string, nullable: true }
                    "Home Email": { type: string, nullable: true }
                    "Phone": { type: string, nullable: true }
                options:
                  type: object
                  nullable: true
                  properties:
                    evidenceOnSuccess: { type: boolean }
                created_by:
                  type: string
                  nullable: true
            example:
              participantId: "12345"
              note: "Correcting hire date per HR records"
              updates:
                "Hire Date": "2024-01-15"
                "Address 1": "123 Main St"
                "City": "San Francisco"
                "State": "CA"
                "Zip Code": "94102"
      responses:
        '202': { description: Accepted (returns jobId) }
        '400': { description: Bad Request }
        '401': { description: Unauthorized }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: No recognized Census labels or invalid field values
        '500': { description: Internal Server Error }

  /forusbot/email-trigger:
    post:
      summary: Trigger email communications to participants
      description: |
        Enqueues a job to trigger various types of email communications to plan participants through the ForUsAll portal.
        Supports multiple email types including statements, onboarding, sponsor quarterly emails, and generic communications.
        Always sends to all participants ("all").
        For `summary_annual_notice`, `reportYear` defaults to the previous UTC year.
        Summary annual jobs are fail-closed unless the private Preview document
        verifier is configured. `expectedDocument` is mandatory and `mode=verify_only`
        performs the full Preview/PDF/OCR gate without clicking Trigger Email.
        When `Idempotency-Key` is supplied, retries with the same normalized request
        reuse the original durable job; a different request with the same key returns 409.
      parameters:
        - in: header
          name: x-auth-token
          schema: { type: string }
          required: true
        - in: header
          name: Idempotency-Key
          schema:
            type: string
            minLength: 8
            maxLength: 200
            pattern: '^[!-~]{8,200}$'
          required: false
          description: Opaque printable-ASCII retry key. Recommended for send operations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, emailType]
              properties:
                planId:
                  type: integer
                  minimum: 1
                  description: Plan ID (must be positive integer)
                  example: 627
                emailType:
                  type: string
                  enum:
                    - monthly_balance
                    - onboard_communications
                    - new_hire_communications
                    - year_end_notice
                    - notify_auto-escalation
                    - summary_annual_notice
                    - statement_notice
                    - sponsor_quarterly_email
                    - generic_email
                    - force_out
                  description: Type of email to trigger
                  example: "statement_notice"
                participants:
                  type: string
                  enum: [all]
                  default: all
                  description: Participant selection (currently only "all" is supported)
                mode:
                  type: string
                  enum: [send, verify_only]
                  default: send
                  description: |
                    `verify_only` is supported only for `summary_annual_notice`
                    and never installs the confirmation handler or clicks Trigger Email.
                    A token may further restrict this with `allowedEmailTriggerModes`;
                    tokens without that registry field retain legacy access.
                reportYear:
                  type: integer
                  minimum: 1900
                  maximum: 9999
                  description: |
                    Report year required by the SAR filename validation for
                    `summary_annual_notice`. Defaults to the previous UTC year.
                expectedDocument:
                  type: object
                  additionalProperties: false
                  required: [schemaVersion, kind, planId, planYear, identitySource]
                  description: |
                    Mandatory for `summary_annual_notice`. The values must match
                    top-level planId/reportYear. Plan names and EIN are deliberately
                    not accepted from callers; the bot extracts them from the portal.
                  properties:
                    schemaVersion: { type: integer, enum: [1] }
                    kind: { type: string, enum: [summary_annual_report] }
                    planId: { type: integer, minimum: 1 }
                    planYear: { type: integer, minimum: 1900, maximum: 9999 }
                    identitySource: { type: string, enum: [forusall_plan] }
                statement:
                  type: object
                  description: Required when emailType is "statement_notice"
                  properties:
                    year: { type: integer, example: 2025 }
                    quarter: { type: integer, minimum: 1, maximum: 4, example: 1 }
                    season: { type: string, example: "Q1" }
                sponsorQuarterly:
                  type: object
                  description: Required when emailType is "sponsor_quarterly_email"
                  required: [year, quarter, caNoteSubject, caNoteDetails, caUrl, quarterlyInvestmentReviewUrl, nextReviewDate, nextReviewTime]
                  properties:
                    year: { type: integer }
                    quarter: { type: integer, minimum: 1, maximum: 4 }
                    caNoteSubject: { type: string }
                    caNoteDetails: { type: string }
                    caUrl: { type: string, format: uri }
                    quarterlyInvestmentReviewUrl: { type: string, format: uri }
                    nextReviewDate: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: "2025-04-15" }
                    nextReviewTime: { type: string, pattern: '^\d{2}:\d{2}$', example: "14:30" }
                onboardOrNewHire:
                  type: object
                  description: Required when emailType is "onboard_communications" or "new_hire_communications"
                  properties:
                    rkType: { type: string, nullable: true, description: "Required for onboard_communications" }
                    planSnapshot: { type: string, nullable: true, description: "Required for onboard_communications" }
                    emailToSend: { type: string, default: "onboard_email" }
                    conversationId: { type: string, nullable: true }
                    attachments: { type: array, items: { type: string } }
                genericEmail:
                  type: object
                  description: Required when emailType is "generic_email"
                  required: [audience, subType]
                  properties:
                    audience:
                      type: object
                      properties:
                        enrolled: { type: boolean }
                        notEnrolled: { type: boolean }
                        terminated: { type: boolean }
                        ineligible: { type: boolean }
                        terminatedParticipants: { type: string, nullable: true }
                    planSnapshot: { type: string, nullable: true }
                    subType:
                      type: object
                      required: [kind]
                      properties:
                        kind:
                          type: string
                          enum: [onboard_communications, new_hire_communications, year_end_notice, notify_auto-escalation, summary_annual_notice, other]
                        otherText: { type: string, nullable: true, description: "Required when kind is 'other'" }
                        rkType: { type: string, nullable: true }
                        emailToSend: { type: string, nullable: true, description: "Required for onboard_communications and new_hire_communications" }
                        conversationId: { type: string, nullable: true }
                        attachments: { type: array, items: { type: string } }
                        terminatedParticipants: { type: string, nullable: true }
            examples:
              statementNotice:
                summary: Statement notice email
                value:
                  planId: 627
                  emailType: "statement_notice"
                  statement:
                    year: 2025
                    quarter: 1
                    season: "Q1"
              sponsorQuarterly:
                summary: Sponsor quarterly email
                value:
                  planId: 627
                  emailType: "sponsor_quarterly_email"
                  sponsorQuarterly:
                    year: 2025
                    quarter: 1
                    caNoteSubject: "Q1 2025 Update"
                    caNoteDetails: "Quarterly investment review details"
                    caUrl: "https://example.com/ca-note"
                    quarterlyInvestmentReviewUrl: "https://example.com/review"
                    nextReviewDate: "2025-04-15"
                    nextReviewTime: "14:30"
              genericEmail:
                summary: Generic email to enrolled participants
                value:
                  planId: 627
                  emailType: "generic_email"
                  genericEmail:
                    audience:
                      enrolled: true
                      notEnrolled: false
                      terminated: false
                      ineligible: false
                    subType:
                      kind: "summary_annual_notice"
      responses:
        '202':
          description: Job accepted and queued, or replay of the original durable job
          headers:
            Idempotency-Replayed:
              schema: { type: string, enum: ['true', 'false'] }
              description: True when this response reuses an existing durable receipt.
          content:
            application/json:
              schema:
                type: object
                required: [ok, jobId, acceptedAt]
                properties:
                  ok: { type: boolean, example: true }
                  jobId: { type: string, format: uuid }
                  acceptedAt: { type: string, format: date-time }
                  queuePosition: { type: integer, nullable: true }
                  estimate:
                    type: object
                    nullable: true
                    properties:
                      startAt: { type: string, format: date-time }
                      finishAt: { type: string, format: date-time }
                  capacitySnapshot:
                    type: object
                    nullable: true
                    properties:
                      running: { type: integer }
                      queued: { type: integer }
                      maxConcurrency: { type: integer }
        '400':
          description: Invalid request format or missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: false }
                  error: { type: string }
                  missing: { type: array, items: { type: string } }
        '401':
          description: Missing or invalid authentication token
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Idempotency-Key conflict }
        '500':
          description: Internal server error
        '503': { description: Durable idempotency or job state temporarily unavailable }


components:
  securitySchemes:
    TokenHeader:
      type: apiKey
      in: header
      name: x-auth-token
      description: Token defined in the server token registry.
    BearerToken:
      type: http
      scheme: bearer
      description: Alternative to x-auth-token.
  schemas:
    HealthResponse:
      type: object
      required: [ok, capabilities]
      properties:
        ok: { type: boolean, example: true }
        capabilities:
          type: object
          required:
            - emailTriggerIdempotency
            - emailTriggerTerminalSemantics
            - emailTriggerReportYear
          properties:
            emailTriggerIdempotency: { type: string, enum: [v1] }
            emailTriggerTerminalSemantics: { type: string, enum: [v1] }
            emailTriggerReportYear: { type: string, enum: [v1] }
            emailTriggerPreviewDocumentGate:
              type: string
              enum: [v1]
              description: Present only when the private verifier is fully configured.

    SarDocumentGate:
      type: object
      additionalProperties: false
      required: [version, verified, documentCount, pdfSha256s, aggregateSha256, manifestStable, objectVersionStable]
      description: |
        Compact non-PII proof returned by successful summary annual jobs. It never
        contains portal URLs, filenames, plan names, EINs, S3 version IDs, or OCR text.
      properties:
        version: { type: string, enum: [v1] }
        verified: { type: boolean, enum: [true] }
        documentCount: { type: integer, minimum: 1 }
        pdfSha256s:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, pattern: '^[a-f0-9]{64}$' }
        aggregateSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        manifestStable: { type: boolean, enum: [true] }
        objectVersionStable: { type: boolean, enum: [true] }
        evidence:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              pdfSha256: { type: string, pattern: '^[a-f0-9]{64}$' }
              provider: { type: string, enum: [document_ai, vision] }
              pagesInspected: { type: integer, minimum: 1 }
              totalPages: { type: integer, minimum: 1, nullable: true }
              truncated: { type: boolean }
              documentMarkerMatch: { type: boolean }
              planNameScore: { type: number, minimum: 0, maximum: 1 }
              einMatch: { type: boolean, nullable: true }
              yearMatch: { type: boolean, nullable: true }

    ResultEnvelope:
      type: object
      required: [ok, code, data, warnings, errors]
      properties:
        ok: { type: boolean }
        code: { type: string, example: SEARCH_OK }
        message: { type: string, nullable: true }
        data:
          type: object
          nullable: true
          description: Payload normalizado por bot
        warnings:
          type: array
          items: {}
        errors:
          type: array
          items: {}

    SubmitJobResponse:
      type: object
      required: [ok, jobId, acceptedAt, warnings, executedBy]
      description: |
        Response shared by asynchronous scrape submissions. On an idempotent
        replay, queuePosition, estimate, and capacitySnapshot are null while
        jobId and acceptedAt remain those of the original accepted job.
      properties:
        ok:
          type: boolean
          example: true
        jobId:
          type: string
          format: uuid
          example: "f628e7c7-11b8-4419-9c30-29c572a99d81"
        acceptedAt:
          type: string
          format: date-time
          example: "2025-11-13T07:09:24.211Z"
        queuePosition:
          type: integer
          nullable: true
          minimum: 1
          example: 1
        estimate:
          type: object
          nullable: true
          properties:
            startAt: { type: string, format: date-time }
            finishAt: { type: string, format: date-time }
        capacitySnapshot:
          type: object
          nullable: true
          properties:
            running: { type: integer }
            queued: { type: integer }
            maxConcurrency: { type: integer }
            slotsAvailable: { type: integer }
        warnings:
          type: array
          description: Non-fatal warnings, such as invalid modules being ignored.
          items:
            type: object
            properties:
              type: { type: string }
              keys: { type: array, items: { type: string } }
              unknown: { type: array, items: { type: string } }
        executedBy:
          type: object
          required: [name, role, at]
          properties:
            name: { type: string, nullable: true }
            role: { type: string }
            at: { type: string, format: date-time }

    StageEntry:
      type: object
      required: [name, startedAt, endedAt, durationMs, status]
      properties:
        name: { type: string }
        startedAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time }
        durationMs: { type: integer, minimum: 0 }
        status: { type: string, enum: [succeed, fail] }
        meta: { type: object, nullable: true }
        error:
          type: object
          nullable: true
          properties:
            name: { type: string }
            message: { type: string }
            stack: { type: string }

    JobPublicResponse:
      type: object
      required: [state]
      description: |
        Shape público minimalista expuesto por GET /forusbot/jobs y /forusbot/jobs/:id.
        Incluye solo los campos que un consumidor externo necesita; oculta toda la
        metadata interna (stages, meta echo, createdBy, métricas, evidencePath, etc.).
        Para forensics y debug interno, usar /forusbot/admin/jobs-db/:id (admin only).
      properties:
        state:
          type: string
          enum: [queued, running, succeeded, failed, canceled]
        data:
          type: object
          nullable: true
          description: |
            Solo presente cuando state=succeeded. El shape es específico por bot
            (ej. scrape-participant: `{participantId, census?, savings_rate?, ...}`;
            update-plan: `{planId, applied, skipped}`; mfa-reset: `{participantId, reset}`).
        error:
          type: object
          nullable: true
          description: Solo presente cuando state=failed.
          properties:
            code: { type: string }
            message: { type: string }
        warnings:
          type: array
          description: Solo presente cuando state=succeeded.
          items: { type: object }
        errors:
          type: array
          description: Solo presente cuando state=succeeded.
          items: { type: object }

    JobAdminResponse:
      type: object
      required:
        [ ok, jobId, botId, state, acceptedAt, result, meta, stages ]
      description: |
        Shape verbose con TODA la metadata interna (stages, meta echo, createdBy,
        timestamps, métricas, stagesSummaryMsByName, etc.). Solo accesible vía
        endpoints /forusbot/admin/jobs-db/* con admin token.
      properties:
        ok:
          type: boolean
          description: Siempre true para el wrapper; útil si se reutiliza en otras respuestas
          example: true
        jobId: { type: string, format: uuid }
        botId: { type: string }
        state: { type: string, enum: [queued, running, succeeded, failed, canceled] }
        acceptedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        createdBy:
          type: object
          nullable: true
          properties:
            name: { type: string, nullable: true }
            role: { type: string, nullable: true }
            at:   { type: string, format: date-time, nullable: true }
        meta:
          type: object
          description: Meta sanitizada (sin selectors)
        result:
          $ref: '#/components/schemas/ResultEnvelope'
        error:
          type: string
          nullable: true
        stages:
          type: array
          description: Historial completo de stages del job
          items:
            $ref: '#/components/schemas/StageEntry'
        stagesSummaryMsByName:
          type: object
          additionalProperties: { type: integer }
          description: (Opcional) Suma de ms por nombre de stage
        waitingSeconds: { type: integer, nullable: true }
        position: { type: integer, nullable: true }
        elapsedSeconds: { type: integer, nullable: true }
        stage: { type: string, nullable: true }
        stageSince: { type: string, format: date-time, nullable: true }
        stageSeconds: { type: integer, nullable: true }
        stageMeta: { type: object, nullable: true }
        totalSeconds: { type: integer, nullable: true }

    WhoAmI:
      type: object
      required: [ok]
      description: |
        Identity payload for the authenticated token. Returned by GET /forusbot/whoami.
        Includes the effective scope (role default ∪ token overrides) so clients
        like the sandbox UI can deduce which endpoints they may invoke without
        having to probe each one.
      properties:
        ok: { type: boolean, example: true }
        role:
          type: string
          nullable: true
          enum: [admin, user, pa_lead, rm_lead, ops_lead, imp_lead]
        isAdmin: { type: boolean }
        user:
          type: object
          nullable: true
          properties:
            name:  { type: string }
            email: { type: string }
            id:    { type: string }
        accountAlias:
          type: string
          nullable: true
          description: |
            Alias of the ForUsAll portal account this token uses when running
            bots. Does NOT include credentials. Null if the token has no
            account attached (legacy or admin-only tokens).
        scope:
          type: object
          nullable: true
          description: |
            Effective token scope (role-default denied features merged with
            per-token overrides). Null only during the legacy grace period
            (token has no role recorded).
          properties:
            role: { type: string }
            deniedFeatures:
              type: array
              items: { type: string }
              description: Feature keys this token cannot invoke (e.g. "update-plan").
            deniedEndpoints:
              type: array
              items:
                type: string
                description: 'Method + space + path pattern, e.g. "POST /forusbot/update-plan"'
            allowedEndpoints:
              type: array
              items: { type: string }
              description: Per-endpoint overrides that bypass deniedFeatures/deniedEndpoints.

    ForbiddenResponse:
      type: object
      required: [ok, error]
      description: |
        Returned with HTTP 403 when authorization fails. Two layers can emit it:
          1. `requireScope` (src/middleware/requireScope.js) — when the token's
             effective scope denies the requested feature/endpoint. Includes
             `feature`, `endpoint`, `reason` for diagnostics.
          2. `requireAdmin` (src/middleware/auth.js) — when a non-admin token
             hits an admin-only endpoint. Includes only `warnings: []` and the
             core `ok/error` fields. On endpoints layered with both, requireAdmin
             runs first, so admin-only routes produce the simpler shape.
      properties:
        ok: { type: boolean, example: false }
        error: { type: string, example: "forbidden" }
        feature:
          type: string
          description: The feature key resolved for this endpoint (requireScope only).
        endpoint:
          type: string
          description: 'Method + space + path pattern, e.g. "POST /forusbot/update-plan" (requireScope only).'
        reason:
          type: string
          description: |
            Machine-readable reason. Examples: "denied-feature:update-plan",
            "denied-endpoint:POST /forusbot/update-plan" (requireScope only).
        warnings:
          type: array
          items: {}
          description: Empty array emitted by requireAdmin's 403 path.

  responses:
    Forbidden:
      description: Forbidden by token scope (feature or endpoint denied)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenResponse'
